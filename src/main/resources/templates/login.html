<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login</title>
		<style>
			/* Загальні стилі */
			body {
				font-family: Arial, sans-serif;
				background-color: #f4f7fc;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}

			/* Контейнер для форми */
			.container {
				background-color: #ffffff;
				border-radius: 8px;
				padding: 30px;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
				width: 100%;
				max-width: 400px;
			}

			h2 {
				text-align: center;
				color: #333;
				margin-bottom: 20px;
			}

			/* Стилі для полів форми */
			input[type='email'],
			input[type='password'] {
				width: 100%;
				padding: 12px;
				margin: 8px 0 20px 0;
				border: 1px solid #ccc;
				border-radius: 4px;
				box-sizing: border-box;
				font-size: 16px;
			}

			input[type='email']:focus,
			input[type='password']:focus {
				border-color: #007bff;
				outline: none;
			}

			/* Стилі для кнопки */
			button {
				width: 100%;
				padding: 12px;
				background-color: #007bff;
				color: white;
				border: none;
				border-radius: 4px;
				font-size: 16px;
				cursor: pointer;
			}

			button:hover {
				background-color: #0056b3;
			}

			/* Стилі для повідомлення про помилки */
			p {
				color: red;
				text-align: center;
				font-size: 14px;
			}

			/* Респонсивність */
			@media (max-width: 600px) {
				.container {
					width: 90%;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h2>Login</h2>
			<form action="/login" method="post">
				<input type="email" name="email" required placeholder="Email" />
				<input
					type="password"
					name="password"
					required
					placeholder="Password"
				/>
				<button type="submit">Login</button>
			</form>

			<!-- Повідомлення про помилки -->
			<p th:if="${error}" style="color: red">
				Invalid credentials, please try again.
			</p>
		</div>
	</body>
</html>
