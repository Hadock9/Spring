<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<title>Список матчів</title>

		<!-- CSS файли -->
		<link rel="stylesheet" type="text/css" th:href="@{/css/navbar.css}" />
		<link rel="stylesheet" type="text/css" th:href="@{/css/footer.css}" />
		<link rel="stylesheet" type="text/css" th:href="@{/css/root.css}" />
		<link rel="stylesheet" type="text/css" th:href="@{/css/matches.css}" />

		<!-- Скрипт для видалення матчу -->
		<script>
			function deleteMatch(matchId) {
				if (confirm('Ви впевнені, що хочете видалити цей матч?')) {
					fetch(`/api/matches/match/${matchId}`, {
						method: 'DELETE',
					})
						.then(response => {
							if (response.ok) {
								location.reload()
							} else {
								alert('Не вдалося видалити матч.')
							}
						})
						.catch(error => {
							console.error('Помилка:', error)
						})
				}
			}
		</script>
	</head>
	<body>
		<header th:replace="fragments/navbar :: navbar"></header>

		<div class="main-container">
			<div class="wrapper">
				<div class="container">
					<h1 class="mt-5">Список матчів</h1>

					<!-- Перевірка наявності матчів -->
					<div th:if="${matches.size() == 0}" class="alert alert-warning">
						Немає результатів для відображення.
					</div>

					<div th:if="${matches.size() > 0}">
						<div class="MatchesContainer">
							<!-- Перебір кожного матчу -->
							<div th:each="match : ${matches}" class="MatchesBlock">
								<!-- Ссилка на нову сторінку для детальнішого перегляду матчу -->
								<a
									th:href="@{/match/{matchId}(matchId=${match.matchId})}"
									class="MatchesLink"
								>
									<div class="MatchesBlockInfo">
										<div class="MatchesBlockTeam">
											<div class="MatchesBlockCountry">
												<img
													draggable="false"
													class="MatchesBlockImgCountry"
													th:src="@{/{country}(country=${match.team1.teamCountry})}"
													alt="Team 1 Country"
												/>
											</div>
											<img
												draggable="false"
												class="MatchesBlockImgLogo"
												th:src="@{/{logo}(logo=${match.team1.teamLogo})}"
												alt="Team 1 Logo"
											/>
											<div class="MatchesBlockCoef MatchesBlockTeam1Coef">
												<p th:text="${match.team1Coef}"></p>
											</div>
										</div>
										<div class="MatchesBlockCenter">
											<p
												class="MatchesBlockVsDateTime"
												th:text="${match.vsDate}"
											></p>
											<p class="MatchesBlockVs">Vs</p>
											<p class="MatchesBlockPlace" th:text="${match.place}"></p>
										</div>
										<div class="MatchesBlockTeam2">
											<div class="MatchesBlockCountry">
												<img
													draggable="false"
													class="MatchesBlockImgCountry"
													th:src="@{/{country}(country=${match.team2.teamCountry})}"
													alt="Team 2 Country"
												/>
											</div>
											<img
												draggable="false"
												class="MatchesBlockImgLogo"
												th:src="@{/{logo}(logo=${match.team2.teamLogo})}"
												alt="Team 2 Logo"
											/>
											<div class="MatchesBlockCoef MatchesBlockTeam2Coef">
												<p th:text="${match.team2Coef}"></p>
											</div>
										</div>
									</div>
								</a>

								<!-- Кнопка видалення -->
								<div class="MatchesBlockSide">
									<button
										class="btn btn-danger"
										th:onclick="|deleteMatch(${match.matchId})|"
										title="Видалити матч"
									>
										&times;
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div th:replace="fragments/footer :: footer"></div>
		</div>
	</body>
</html>
